<main class="flex-1 space-y-6 p-5 lg:p-7">
  <div>
    <h1 class="font-serif text-2xl">{{ 'Watumiaji' | t }}</h1>
    <p class="mt-1 text-sm text-muted">{{ 'Akaunti zinazoweza kuingia kwenye mfumo, nyadhifa zao na moduli wanazofikia.' | t }}</p>
  </div>

  <nav class="flex gap-1 border-b border-line" [attr.aria-label]="'Sehemu za watumiaji' | t">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="border-brass-strong font-medium text-brass-strong"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        class="-mb-px border-b-2 border-transparent px-4 py-2 text-sm text-muted hover:text-ink"
      >
        {{ tab.label | t }}
      </a>
    }
  </nav>

  <router-outlet />
</main>
