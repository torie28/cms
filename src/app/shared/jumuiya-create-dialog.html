<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4"
  animate.enter="backdrop-in"
  animate.leave="backdrop-out"
  (click)="close()"
>
  <section
    class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded border border-line bg-surface p-5"
    role="dialog"
    aria-modal="true"
    aria-labelledby="jumuiya-create-title"
    (click)="$event.stopPropagation()"
  >
    <h2 id="jumuiya-create-title" class="font-serif text-xl">{{ 'Ongeza jumuiya' | t }}</h2>
    <p class="mt-1 text-sm text-muted">{{ 'Jumuiya mpya itaongezwa kwenye {kanda}.' | t: { kanda: kanda().name } }}</p>

    @if (error()) {
      <p class="alert-in mt-4 rounded border border-negative/40 bg-negative/10 px-3 py-2 text-sm text-negative" role="alert">
        {{ error() }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-5 space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label for="jc-name" class="mb-1 block text-xs tracking-[0.12em] text-muted uppercase">{{ 'Jina' | t }}</label>
          <input
            id="jc-name"
            type="text"
            formControlName="name"
            [placeholder]="'Jumuiya ya Mt. Yosefu' | t"
            class="w-full rounded border border-line bg-canvas px-3 py-2 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
            [class.border-negative]="form.controls.name.invalid && form.controls.name.touched"
          />
        </div>
        <div>
          <label for="jc-kanda" class="mb-1 block text-xs tracking-[0.12em] text-muted uppercase">{{ 'Kanda' | t }}</label>
          <input
            id="jc-kanda"
            type="text"
            [value]="kanda().name"
            disabled
            class="w-full rounded border border-line bg-sunken px-3 py-2 text-sm text-muted"
          />
        </div>
        <div class="sm:col-span-2">
          <label for="jc-chair" class="mb-1 block text-xs tracking-[0.12em] text-muted uppercase">{{ 'Mwenyekiti' | t }}</label>
          <input
            id="jc-chair"
            type="text"
            formControlName="chairperson"
            class="w-full rounded border border-line bg-canvas px-3 py-2 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
          />
        </div>
      </div>

      <div>
        <div class="flex items-baseline justify-between gap-3">
          <h3 class="text-xs tracking-[0.12em] text-faint uppercase">{{ 'Wanajumuiya (si lazima)' | t }}</h3>
          <button type="button" class="text-sm text-brass-strong hover:underline" (click)="addMember()">
            {{ '+ Ongeza mstari' | t }}
          </button>
        </div>
        <div formArrayName="members" class="mt-2 space-y-2">
          @for (row of members.controls; track row; let i = $index) {
            <div [formGroupName]="i" class="grid grid-cols-[1fr_9rem_8rem_auto] items-center gap-2">
              <input
                type="text"
                formControlName="name"
                [placeholder]="'Jina la mwanajumuiya' | t"
                [attr.aria-label]="'Jina la mwanajumuiya' | t"
                class="w-full rounded border border-line bg-canvas px-3 py-1.5 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
              />
              <input
                type="tel"
                formControlName="phone"
                [placeholder]="'Simu' | t"
                [attr.aria-label]="'Simu' | t"
                class="w-full rounded border border-line bg-canvas px-3 py-1.5 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
              />
              <select
                formControlName="gender"
                [attr.aria-label]="'Jinsia' | t"
                class="w-full rounded border border-line bg-canvas px-2 py-1.5 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
              >
                <option value="">{{ 'Jinsia' | t }}</option>
                <option value="male">{{ 'Mwanaume' | t }}</option>
                <option value="female">{{ 'Mwanamke' | t }}</option>
              </select>
              <button
                type="button"
                class="rounded px-2 py-1 text-faint hover:bg-sunken hover:text-negative"
                [attr.aria-label]="'Ondoa' | t"
                (click)="removeMember(i)"
              >
                ×
              </button>
            </div>
          }
        </div>
        <p class="mt-1 text-xs text-faint">{{ 'Mistari isiyo na jina itarukwa.' | t }}</p>
      </div>

      <div>
        <label for="jc-notes" class="mb-1 block text-xs tracking-[0.12em] text-muted uppercase">{{ 'Maelezo' | t }}</label>
        <textarea
          id="jc-notes"
          formControlName="notes"
          rows="2"
          class="w-full rounded border border-line bg-canvas px-3 py-2 text-sm focus:border-brass focus:ring-1 focus:ring-brass focus:outline-none"
        ></textarea>
      </div>

      <div class="flex justify-end gap-2">
        <button type="button" class="rounded px-3 py-2 text-sm text-muted hover:bg-sunken" [disabled]="saving()" (click)="close()">
          {{ 'Ghairi' | t }}
        </button>
        <button
          type="submit"
          class="rounded bg-brass-strong px-4 py-2 text-sm font-medium text-canvas disabled:opacity-60"
          [disabled]="saving()"
        >
          {{ (saving() ? 'Inahifadhi…' : 'Hifadhi jumuiya') | t }}
        </button>
      </div>
    </form>
  </section>
</div>
