<div
  class="inline-flex items-center rounded-full border border-line bg-surface p-0.5"
  role="group"
  aria-label="Colour theme"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="flex h-7 w-8 items-center justify-center rounded-full transition-colors"
      [class]="
        preference() === option.value
          ? 'bg-brass-tint text-brass-strong'
          : 'text-faint hover:text-ink'
      "
      [attr.aria-pressed]="preference() === option.value"
      [title]="option.label + ' theme'"
      (click)="select(option.value)"
    >
      <span class="sr-only">{{ option.label }} theme</span>
      @switch (option.value) {
        @case ('light') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4">
            <circle cx="12" cy="12" r="4" />
            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        }
        @case ('dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-4 w-4">
            <rect x="3" y="4" width="18" height="12" rx="1.5" />
            <path stroke-linecap="round" d="M8 20h8m-4-4v4" />
          </svg>
        }
      }
    </button>
  }
</div>
