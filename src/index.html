<!doctype html>
<html lang="sw" translate="no">
<head>
  <meta charset="utf-8">
  <!-- The app has its own Swahili/English switch; stop browsers offering to machine-translate it. -->
  <meta name="google" content="notranslate">
  <title>Church Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)">
  <!-- CSP is set as an HTTP header in server.ts (with a per-request nonce for SSR inline scripts). -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="boot.js"></script>
</head>
<body>
  <!-- Per-request nonce placeholder below is filled in by server.ts. -->
  <app-root ngCspNonce="NG_CSP_NONCE"></app-root>
</body>
</html>
