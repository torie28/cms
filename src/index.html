<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Church Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    (function () {
      try {
        var stored = localStorage.getItem('cms.theme');
        var dark = stored === 'dark' || ((!stored || stored === 'system')
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
